[package]
name = "xmip-core-library-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-library-net"
description = "Network primitives the capabilities share, one copy of each: an address, a URI's authority, path and endpoint, a network in prefix notation, a MAC address, the one TCP connect, a line-oriented head, HTTP/1.1 and HTTP/2 with HPACK, both halves, the one named pipe, Linux's IEEE 802.15.4 socket, and JSON-RPC 2.0, both framings."

[lib]
path = "src/lib.rs"

[dependencies]
# Hex, which a MAC address and a percent escape are both spelled in; and
# the wide string the named pipe's paths, descriptor and names cross to
# Windows as (`codec::wide`).
codec = { workspace = true }
# JSON-RPC 2.0's messages are JSON values (`rpc`), so only a crate that
# asks for the `rpc` feature links a JSON library.
serde_json = { version = "1", optional = true }

# The named pipe (`pipe`; ADR-0014, amendment 2026-10-21): on Windows made,
# connected, read and written through the system's own calls, its security
# descriptor written from SDDL, a client opened lent for identification
# alone, the account it connected as and the identifier of an account
# admitted (`system/pipe/`). The named pipe transport and the runtime's
# local endpoint both make theirs here. And the TCP connect's socket, its
# SYN sent once and its refusal answered at once (`system/connect.rs`;
# ADR-0044, amendment 2026-11-14).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_Pipes", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

# On Unix the transport's pipe is a FIFO, which the standard library does
# not make; `nix` makes it with a safe call.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs"] }

# An IEEE 802.15.4 interface's socket (`ieee802154`; ADR-0050, amendment
# 2026-11-27): `AF_IEEE802154`, its socket address, `SIOCGIFADDR`, `poll`
# and the calls on it, made in `system/ieee802154.rs`, since no crate here
# lays out an 802.15.4 socket address without an unsafe constructor.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
# A loopback address no one holds (`fixture`), the estate's one for every
# test that binds a port later or wants nothing listening, and an HTTP/2
# peer flooding PINGs either side of a span (`fixture::pinging`). A crate
# asks for it from its dev-dependencies, so it reaches tests and never a
# production build.
test-support = []

# JSON-RPC 2.0, its messages and both its framings (`rpc`): the VS Code
# server and `xmip mcp` ask for it. The transports that share the rest of
# this crate never do, so none of them links serde_json, whose comparisons
# of a number with a JSON value would make every `== []` of theirs
# ambiguous (2026-11-19).
rpc = ["dep:serde_json"]

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
# The timing program's figure, the fastest of five over its rounds, read
# once for the estate (`xcore::latency`). Test-only: what this library is
# built out of stays Library (`test/Layer.Test.ps1` reads `[dependencies]`).
xcore = { workspace = true, features = ["test-support"] }
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { workspace = true, features = ["test-support"] }

[lints.rust]
# deny, not forbid: the crate's calls to the operating system — Windows'
# named pipe and TCP connect, Linux's IEEE 802.15.4 socket — cross a C
# interface in one folder, `src/system/`, each file lowering this at its
# top (ADR-0050, amendments 2026-10-21, 2026-11-14 and 2026-11-27;
# `test/Unsafe.Test.ps1` holds the folder). Every other file of the crate
# writes no unsafe code.
unsafe_code = "deny"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"
